name: Mutation

# Advisory: Stryker.NET reports which plausible faults the tests would miss. No score threshold;
# keep "mutation / mutation" and "mutation / kill-report" out of required checks. Label a PR
# "mutation" for a full run instead of only the changed code.
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

# A new push to a PR cancels its superseded run. A label other than "mutation" starts a run that does
# nothing, so it gets a group of its own instead of cancelling a real one.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'mutation' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/mutation.yml@98738d9d6f9294110f8ff7317f2300e3b1a52e72 # v0.9.0
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      test-project: Buildingway.Tools.Tests
      # kill-report runs the tool this PR builds: the package can't list itself in its tool manifest
      buildingway-project: Buildingway.Tools
