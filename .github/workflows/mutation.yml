name: Mutation

# Advisory: Stryker.NET reports which plausible faults the tests would miss. No score threshold;
# keep "mutation / mutation" and "mutation / kill-report" out of required checks. Label a PR
# "mutation" for a full run instead of only the changed code.
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

permissions:
  contents: read

jobs:
  mutation:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/mutation.yml@2dc2514507e9a7a69c2cdd457483ce346095a244 # v0.7.0
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      test-project: Buildingway.Tools.Tests
      # kill-report runs the tool this PR builds: the package can't list itself in its tool manifest
      buildingway-project: Buildingway.Tools
