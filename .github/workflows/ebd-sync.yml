name: ebd sync

# Fails when a copied ebd script (Buildingway.Tools/Scripts, listed in SOURCES) differs from
# ebd's latest or has left ebd, and opens or updates a PR from the ebd-sync branch that recopies
# them. ebd is private; it publishes those scripts to the public mirror Cellar-Mander/ebd-scripts,
# so this needs no credential for ebd.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency: ebd-sync

permissions: {}

jobs:

  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # pushes the ebd-sync branch
      pull-requests: write  # opens or updates its PR
      actions: write        # starts CI on it

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout the mirror
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/ebd-scripts
        path: .ebd-scripts
        persist-credentials: false

    - name: Check against ebd's latest
      id: check
      run: |
        if ! .github/scripts/ebd-scripts check --latest .ebd-scripts; then
          echo "drift=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync
      if: steps.check.outputs.drift == 'true'
      run: .github/scripts/ebd-scripts sync .ebd-scripts | tee "$RUNNER_TEMP/sync.txt"

    # Force-pushes ebd-sync from main each run, so the PR always holds one current sync
    - name: Open or update PR
      if: steps.check.outputs.drift == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ebd-sync
      run: |
        head=$(head -n 1 .ebd-scripts/MANIFEST | cut -d' ' -f2 | cut -c1-7)
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        gh auth setup-git
        git switch -c "$BRANCH"
        git add -A Buildingway.Tools
        git commit -q -m "Sync ebd scripts to ebd $head"
        git push -f origin "$BRANCH"

        {
          echo "Recopies the ebd scripts in \`Buildingway.Tools/Scripts\` from the mirror Cellar-Mander/ebd-scripts, at ebd \`$head\`, and pins them there in \`SOURCES\`."
          echo
          echo '```'
          cat "$RUNNER_TEMP/sync.txt"
          echo '```'
          if grep -q '^removed ' "$RUNNER_TEMP/sync.txt"; then
            echo
            echo "**A script has left ebd.** Its copy and EmbeddedResource are gone; remove its command from \`Program.cs\`, the CI smoke test and the README before merging."
          fi
          echo
          echo "Before merging, diff the copies against ebd \`$head\`: the mirror is the only source this PR checks them against."
          echo
          echo "Opened by the ebd sync workflow."
        } > "$RUNNER_TEMP/body.md"

        pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
        if [[ -n $pr ]]; then
          gh pr edit "$pr" --title "Sync ebd scripts to ebd $head" --body-file "$RUNNER_TEMP/body.md"
        else
          pr=$(gh pr create --base main --head "$BRANCH" --title "Sync ebd scripts to ebd $head" --body-file "$RUNNER_TEMP/body.md")
        fi
        gh workflow run ci.yml --ref "$BRANCH"
        echo "PR_URL=$pr" >> "$GITHUB_ENV"

    - name: Fail on drift
      if: steps.check.outputs.drift == 'true'
      run: |
        echo "::error::Copied ebd scripts are behind ebd; sync PR: $PR_URL"
        exit 1
