name: CI

# No path filter: a required check that a filter skips never reports.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:

  # Windows too: dev-plugin's claim and default folders differ there
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Format
      run: dotnet format Buildingway.Tools.slnx --verify-no-changes

    - name: Test
      run: dotnet test Buildingway.Tools.slnx --nologo

    - name: Pack
      run: dotnet pack Buildingway.Tools -c Release --nologo -o pack

    # The packed tool runs and its embedded Python tools start
    - name: Smoke test
      shell: bash
      run: |
        dotnet tool install --tool-path tool --add-source pack Buildingway.Tools --version 0.0.0-dev
        tool/buildingway revert-check --help
        tool/buildingway mutant-triage --help

  lint:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/workflow-lint.yml@95d5f7efba161c33e5cd0eca87d7e5499140c584 # v0.3.0
